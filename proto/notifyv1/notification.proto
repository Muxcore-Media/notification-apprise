syntax = "proto3";
package muxcore.notification.apprise.v1;
option go_package = "github.com/Muxcore-Media/notification-apprise/proto/notifyv1;notifyv1";

service NotificationService {
  rpc Notify(NotifyRequest) returns (NotifyResponse);
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
}

enum Channel {
  CHANNEL_UNSPECIFIED = 0;
  CHANNEL_APPRISE = 1;
  CHANNEL_DISCORD = 2;
  CHANNEL_SLACK = 3;
  CHANNEL_WEBHOOK = 4;
}

message NotifyRequest {
  string title = 1;
  string message = 2;
  string severity = 3;
  string source_module = 4;
  repeated Channel channels = 5;
  map<string, string> fields = 6;
}

message NotifyResponse {
  repeated ChannelResult results = 1;
}

message ChannelResult {
  Channel channel = 1;
  bool success = 2;
  string error = 3;
}

message ConfigureRequest {
  Channel channel = 1;
  map<string, string> settings = 2;
}

message ConfigureResponse {
  bool configured = 1;
}

message StatusRequest {}

message StatusResponse {
  repeated ChannelStatus channels = 1;
}

message ChannelStatus {
  Channel channel = 1;
  bool enabled = 2;
  string description = 3;
}
